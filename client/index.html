<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Penny</title>
    <meta name="description" content="Penny is a calm personal budget that shows your balance months ahead: payments, recurring bills, installments and debts in one forecast. Share a budget with the people you live with. No ads, no tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Penny" />
    <meta property="og:title" content="Penny: see your money months ahead" />
    <meta property="og:description" content="Payments, recurring bills, installments and debts in one clear forecast. Share a budget with the people you live with. No ads, no tracking." />
    <meta property="og:url" content="__APP_URL__/" />
    <meta property="og:image" content="__APP_URL__/landing/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before the first paint so there is no light/dark flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
